<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111c">
  <title>عجلة الحظ | تحديثات MOHAB STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111c;
      --surface: #0b1b2a;
      --surface-2: #10283a;
      --cyan: #18b8d2;
      --cyan-light: #79e5f4;
      --white: #f3f8fb;
      --muted: #9aafbd;
      --stroke: rgba(67, 198, 220, .22);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(ellipse at 50% 40%, rgba(16, 117, 146, .22), transparent 42%),
        radial-gradient(circle at 8% 12%, rgba(20, 111, 139, .10), transparent 25%),
        radial-gradient(circle at 92% 88%, rgba(20, 111, 139, .10), transparent 25%),
        var(--bg);
      font-family: "Almarai", "Noto Sans Arabic", sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(38, 183, 211, .08);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -210px; right: -150px; box-shadow: 0 0 0 28px rgba(38,183,211,.018), 0 0 0 58px rgba(38,183,211,.014); }
    body::after { bottom: -240px; left: -150px; box-shadow: 0 0 0 28px rgba(38,183,211,.018), 0 0 0 58px rgba(38,183,211,.014); }

    .page {
      width: min(100%, 590px);
      position: relative;
      isolation: isolate;
      padding: 22px;
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(14, 35, 51, .96), rgba(7, 20, 32, .98));
      border: 1px solid var(--stroke);
      box-shadow: 0 30px 100px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.045);
      animation: rise .85s cubic-bezier(.2,.8,.2,1) both;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(104,225,241,.38), transparent 30%, transparent 72%, rgba(24,184,210,.22));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 5px 20px;
      border-bottom: 1px solid rgba(142, 188, 207, .12);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #e9f7fb;
    }
    .brand-mark {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 11px;
      color: var(--cyan-light);
      background: rgba(24,184,210,.10);
      border: 1px solid rgba(24,184,210,.25);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 30px;
      color: #9ceaf4;
      background: rgba(24,184,210,.08);
      border: 1px solid rgba(24,184,210,.18);
      font-size: 14px;
      line-height: 1;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #42d4e7;
      box-shadow: 0 0 12px #18b8d2;
      animation: blink 1.6s ease-in-out infinite;
    }
    .content { text-align: center; padding: 34px 12px 14px; }
    .visual {
      width: 174px; height: 174px;
      position: relative;
      display: grid;
      place-items: center;
      margin: 0 auto 27px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(27,147,174,.20) 0 38%, rgba(12,38,55,.25) 39% 65%, transparent 66%);
    }
    .visual::before, .visual::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(70,206,226,.24);
      border-radius: 50%;
    }
    .visual::after {
      inset: 0;
      border-style: dashed;
      border-color: rgba(70,206,226,.28);
      animation: rotate 28s linear infinite;
    }
    .gear {
      width: 90px; height: 90px;
      color: var(--cyan-light);
      filter: drop-shadow(0 0 18px rgba(24,184,210,.38));
      animation: rotate 16s linear infinite;
    }
    .wrench {
      position: absolute;
      width: 43px; height: 43px;
      color: #e8fbff;
      filter: drop-shadow(0 0 9px rgba(24,184,210,.35));
      animation: float 3.4s ease-in-out infinite;
    }
    .orbit {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--cyan-light);
      box-shadow: 0 0 15px var(--cyan);
    }
    .orbit.one { top: 20px; right: 25px; }
    .orbit.two { bottom: 22px; left: 24px; width: 6px; height: 6px; opacity: .65; }
    .kicker {
      margin: 0 0 8px;
      color: var(--cyan-light);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 43px);
      line-height: 1.45;
      font-weight: 700;
      color: #f6fbfd;
      text-shadow: 0 3px 25px rgba(62,203,226,.10);
    }
    .description {
      max-width: 430px;
      margin: 13px auto 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.9;
    }
    .progress-area {
      width: min(100%, 290px);
      margin: 27px auto 0;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      color: #7897a9;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 1.4px;
      margin-bottom: 9px;
    }
    .progress {
      height: 4px;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(137,183,199,.13);
    }
    .progress span {
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #117c9a, #75e5f2);
      box-shadow: 0 0 14px rgba(24,184,210,.7);
      animation: loading 2.8s ease-in-out infinite alternate;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 28px;
      padding-top: 19px;
      border-top: 1px solid rgba(142,188,207,.10);
      color: #7893a4;
      font-size: 16px;
    }
    .footer svg { width: 17px; height: 17px; color: var(--cyan); flex: 0 0 auto; }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: .35; } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-9deg); } 50% { transform: translateY(-7px) rotate(5deg); } }
    @keyframes loading { from { transform: translateX(0); } to { transform: translateX(160%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.985); } to { opacity: 1; transform: none; } }
    @media (max-width: 440px) {
      body { padding: 15px; }
      .page { padding: 17px 15px; border-radius: 27px; }
      .content { padding: 29px 5px 12px; }
      .visual { width: 150px; height: 150px; margin-bottom: 21px; }
      .gear { width: 78px; height: 78px; }
      .description { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page" aria-labelledby="page-title">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V8l8-4 8 4v11"/><path d="M9 19v-6h6v6"/><path d="M2 19h20"/>
          </svg>
        </span>
        <span>MOHAB STORE</span>
      </div>
      <div class="status"><span class="status-dot"></span> تحديثات جارية</div>
    </header>

    <section class="content">
      <div class="visual" aria-hidden="true">
        <span class="orbit one"></span><span class="orbit two"></span>
        <svg class="gear" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M43 5h14l3 10.2a36 36 0 0 1 8.2 3.4l9.1-5.1 9.9 9.9-5.1 9.1a36 36 0 0 1 3.4 8.2L96 43v14l-10.2 3a36 36 0 0 1-3.4 8.3l5.1 9.1-9.9 9.9-9.1-5.1a36 36 0 0 1-8.2 3.4L57 96H43l-3-10.2a36 36 0 0 1-8.3-3.4l-9.1 5.1-9.9-9.9 5.1-9.1a36 36 0 0 1-3.4-8.3L4 57V43l10.2-3a36 36 0 0 1 3.4-8.2l-5.1-9.1 9.9-9.9 9.1 5.1a36 36 0 0 1 8.3-3.4L43 5Z" fill="currentColor" opacity=".13" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="19" stroke="currentColor" stroke-width="4"/>
          <circle cx="50" cy="50" r="7" fill="currentColor" opacity=".65"/>
        </svg>
        <svg class="wrench" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4l-3 3-3-3 3-3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="kicker">نعود إليك قريباً</p>
      <h1 id="page-title">عجلة الحظ تحت الصيانة</h1>
      <p class="description">
        نعمل الآن على تطوير عجلة الحظ وإضافة تحسينات جديدة لتكون تجربتك القادمة أفضل وأكثر تميزاً.
      </p>

      <div class="progress-area" aria-label="جاري العمل على التحديثات">
        <div class="progress-label"><span>جاري التطوير</span><span>MOHAB STORE</span></div>
        <div class="progress"><span></span></div>
      </div>
    </section>

    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3 4.5 6v5.2c0 4.7 3.2 8.1 7.5 9.8 4.3-1.7 7.5-5.1 7.5-9.8V6L12 3Z"/><path d="m9 12 2 2 4-4"/>
      </svg>
      <span>شكراً لثقتك بنا، نقدر انتظارك</span>
    </footer>
  </main>
</body>
</html>
